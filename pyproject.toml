[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-data"
version = "0.1.0"
description = "Flight data pipeline for the AR drone arena: ingest, clock alignment and dataset export"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "mcap>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arena-data = "arena_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
